<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbol Quiz</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Symbol Quiz">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f1ea; --panel:#fffdf7; --ink:#1d2421; --muted:#6b726d; --line:#d9d5c8;
  --accent:#1f6f5c; --accent-ink:#fff; --good:#2e7d4f; --good-bg:#e3f2e8; --bad:#b3412e; --bad-bg:#f8e4df;
  --t1:#2e7d4f; --t2:#b7791f; --t3:#b3412e; --t0:#3b5b8c;
  --grid: rgba(31,111,92,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif; min-height:100vh;
}
.wrap{max-width:760px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
button,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -16px rgba(0,0,0,.25)}
h2{font-size:18px;margin:0 0 14px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tier{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.tier:hover{transform:translateY(-1px)}
.tier.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,111,92,.15)}
.tier .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.tier b{font-size:16px}
.tier .count{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}
button.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
button.link{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:4px}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.symbol{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;height:260px;padding:14px;margin-bottom:18px}
.symbol img{max-width:100%;max-height:100%;object-fit:contain}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;color:inherit}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font:600 12px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--muted);background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.feedback{margin-top:16px;border-radius:10px;padding:14px 16px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback strong{display:block;margin-bottom:4px}
.known{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:15px;cursor:pointer;user-select:none}
.known input{width:18px;height:18px;accent-color:var(--accent)}
.score{font-size:48px;font-weight:700;margin:4px 0;color:var(--accent)}
.missed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:90px;object-fit:contain}
.card .nm{font-weight:600}
.card label{display:flex;gap:6px;align-items:center;color:var(--muted);cursor:pointer}
.card input{accent-color:var(--accent)}
.card.isknown{opacity:.55}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;color:#fff;align-self:flex-start}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;color:inherit}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.hidden{display:none!important}
@media (max-width:520px){
  .wrap{padding-top:calc(16px + env(safe-area-inset-top))}
  header{flex-direction:column;gap:2px;margin-bottom:14px}
  h1{font-size:22px}
  .panel{padding:16px;border-radius:12px}
  .tiers{grid-template-columns:1fr 1fr;gap:8px}
  .tier{padding:11px}
  .symbol{height:190px;margin-bottom:12px}
  .opt{padding:12px}
  .row .btn{flex:1}
  #start .row .btn{flex:1 1 100%}
  .score{font-size:40px}
  .missed{grid-template-columns:repeat(2,1fr)}
}
@media (hover:none){.opt kbd{display:none}.tier:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Circuit <span>Symbol</span> Quiz</h1>
    <span class="sub" id="totalKnown"></span>
  </header>

  <!-- START -->
  <section id="start" class="panel">
    <h2>Choose a difficulty</h2>
    <div class="tiers" id="tiers"></div>
    <p class="hint" id="startHint"></p>
    <div class="row">
      <button class="btn" id="go">Start quiz (10 questions)</button>
      <button class="btn ghost" id="openManage">Browse / manage known symbols</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="panel hidden">
    <div class="top"><span id="qnum"></span><span id="qscore"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="symbol"><img id="qimg" alt="Circuit symbol"></div>
    <p class="q">What is this symbol?</p>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb">
      <strong id="fbTitle"></strong>
      <span id="fbNote"></span>
      <label class="known"><input type="checkbox" id="knownBox"> I know this one — leave it out of future quizzes</label>
    </div>
    <div class="row">
      <button class="btn hidden" id="next">Next</button>
      <button class="link" id="quit">Quit quiz</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="panel hidden">
    <h2>Quiz finished</h2>
    <div class="score" id="final"></div>
    <p class="hint" id="finalMsg"></p>
    <div id="missedWrap">
      <h2 style="margin-top:22px">Symbols to review</h2>
      <div class="missed" id="missed"></div>
    </div>
    <div class="row">
      <button class="btn" id="again">Play again</button>
      <button class="btn ghost" id="home">Change difficulty</button>
    </div>
  </section>

  <!-- MANAGE -->
  <section id="manage" class="panel hidden">
    <h2>All symbols</h2>
    <p class="hint" style="margin-top:-6px;margin-bottom:12px">Tick “Known” to leave a symbol out of quizzes. Untick to bring it back.</p>
    <div class="filters" id="mfilters"></div>
    <div class="missed" id="mgrid"></div>
    <div class="row">
      <button class="btn" id="mback">Back</button>
      <button class="link" id="resetKnown">Reset all known symbols</button>
    </div>
  </section>
</div>

const TIERS = [
  {id:1,name:"Common",color:"var(--t1)"},
  {id:2,name:"Less common",color:"var(--t2)"},
  {id:3,name:"Least common",color:"var(--t3)"},
  {id:0,name:"All components",color:"var(--t0)"}
];
const QUESTIONS = 10, OPTIONS = 5, KEY = "circuitSymbolQuiz.known.v1";

// ---- known-symbols storage (saved in this browser) ----
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function saveKnown(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch(e) {} updateHeader(); }
function setKnown(id, on){ on ? known.add(id) : known.delete(id); saveKnown(); }

const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tierOf = t => TIERS.find(x => x.id === t);
const inTier = (s, t) => t === 0 || s.tier === t;
const available = t => SYMBOLS.filter(s => inTier(s, t) && !known.has(s.id));

function show(id){ ["start","quiz","results","manage"].forEach(s => $(s).classList.toggle("hidden", s !== id)); window.scrollTo(0,0); }
function updateHeader(){ $("totalKnown").textContent = `${known.size} of ${SYMBOLS.length} marked known`; }

// ---- start screen ----
let tier = 1;
try { tier = +(localStorage.getItem(KEY + ".tier") ?? 1); } catch(e) {}
function renderStart(){
  $("tiers").innerHTML = "";
  TIERS.forEach(t => {
    const all = SYMBOLS.filter(s => inTier(s, t.id)).length, left = available(t.id).length;
    const b = document.createElement("button");
    b.className = "tier" + (t.id === tier ? " sel" : "");
    b.innerHTML = `<span class="dot" style="background:${t.color}"></span><b>${t.name}</b><span class="count">${left} to study · ${all - left} known</span>`;
    b.onclick = () => { tier = t.id; try { localStorage.setItem(KEY + ".tier", tier); } catch(e) {} renderStart(); };
    $("tiers").appendChild(b);
  });
  const n = available(tier).length;
  $("go").disabled = n === 0;
  $("go").textContent = `Start quiz (${Math.min(n, QUESTIONS)} questions)`;
  $("startHint").textContent = n === 0 ? "You've marked every symbol in this group as known. Pick another group, or untick some in “Browse”."
    : n < QUESTIONS ? `Only ${n} symbol${n>1?"s":""} left to study in this group, so this quiz is shorter.` : "";
  updateHeader();
}

// ---- quiz ----
let quiz = [], qi = 0, score = 0, answered = false, missed = [];

function makeOptions(s){
  // distinct answer names; mix lookalikes from the same family with random ones
  const names = new Set([s.name]);
  const same = shuffle(SYMBOLS.filter(x => x.fam === s.fam && x.name !== s.name));
  const other = shuffle(SYMBOLS.filter(x => x.fam !== s.fam));
  for (const x of same) { if (names.size >= 3) break; names.add(x.name); }
  for (const x of other) { if (names.size >= OPTIONS) break; names.add(x.name); }
  for (const x of shuffle(SYMBOLS)) { if (names.size >= OPTIONS) break; names.add(x.name); }
  return shuffle([...names]);
}

function startQuiz(){
  quiz = shuffle(available(tier)).slice(0, QUESTIONS).map(s => ({ s, opts: makeOptions(s) }));
  qi = 0; score = 0; missed = [];
  show("quiz"); renderQ();
}

function renderQ(){
  const { s, opts } = quiz[qi];
  answered = false;
  $("qnum").textContent = `Question ${qi + 1} of ${quiz.length}`;
  $("qscore").textContent = `Score: ${score}`;
  $("prog").style.width = (qi / quiz.length * 100) + "%";
  $("qimg").src = s.img;
  $("fb").className = "feedback";
  $("next").classList.add("hidden");
  $("opts").innerHTML = "";
  opts.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "opt"; b.dataset.name = name;
    b.innerHTML = `<kbd>${i + 1}</kbd><span></span>`;
    b.querySelector("span").textContent = name;
    b.onclick = () => answer(name);
    $("opts").appendChild(b);
  });
}

function answer(name){
  if (answered) return;
  answered = true;
  const { s } = quiz[qi], ok = name === s.name;
  if (ok) score++; else missed.push(s);
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    if (b.dataset.name === s.name) b.classList.add("right");
    else if (b.dataset.name === name) b.classList.add("wrong");
  });
  $("fb").className = "feedback show " + (ok ? "ok" : "no");
  $("fbTitle").textContent = ok ? "Correct!" : `Not quite — it's: ${s.name}`;
  $("fbNote").textContent = s.note;
  $("knownBox").checked = known.has(s.id);
  $("knownBox").onchange = e => setKnown(s.id, e.target.checked);
  $("qscore").textContent = `Score: ${score}`;
  $("next").textContent = qi + 1 < quiz.length ? "Next" : "See results";
  $("next").classList.remove("hidden");
  $("next").focus();
}

function next(){
  if (!answered) return;
  qi++;
  if (qi < quiz.length) renderQ(); else results();
}

function card(s){
  const d = document.createElement("div");
  d.className = "card" + (known.has(s.id) ? " isknown" : "");
  const t = tierOf(s.tier);
  d.innerHTML = `<img alt=""><span class="nm"></span><span class="tag" style="background:${t.color}">${t.name}</span><label><input type="checkbox"> Known</label>`;
  d.querySelector("img").src = s.img;
  d.querySelector(".nm").textContent = s.name;
  const cb = d.querySelector("input");
  cb.checked = known.has(s.id);
  cb.onchange = () => { setKnown(s.id, cb.checked); d.classList.toggle("isknown", cb.checked); };
  return d;
}

function results(){
  show("results");
  $("final").textContent = `${score} / ${quiz.length}`;
  const pct = score / quiz.length;
  $("finalMsg").textContent = pct === 1 ? "Perfect round! Tick the ones you're sure of so the next quiz focuses on new symbols."
    : pct >= .7 ? "Nice work. Review the ones below and go again."
    : "Keep at it — repetition is what makes these stick.";
  $("missedWrap").classList.toggle("hidden", missed.length === 0);
  $("missed").innerHTML = "";
  missed.forEach(s => $("missed").appendChild(card(s)));
}

// ---- manage ----
let mfilter = 0;
function renderManage(){
  $("mfilters").innerHTML = "";
  TIERS.slice(3).concat(TIERS.slice(0,3)).forEach(t => {
    const c = document.createElement("button");
    c.className = "chip" + (mfilter === t.id ? " sel" : "");
    c.textContent = t.id === 0 ? "All" : t.name;
    c.onclick = () => { mfilter = t.id; renderManage(); };
    $("mfilters").appendChild(c);
  });
  $("mgrid").innerHTML = "";
  SYMBOLS.filter(s => inTier(s, mfilter)).forEach(s => $("mgrid").appendChild(card(s)));
}

// ---- wiring ----
$("go").onclick = startQuiz;
$("next").onclick = next;
$("quit").onclick = () => { show("start"); renderStart(); };
$("again").onclick = () => { if (available(tier).length) startQuiz(); else { show("start"); renderStart(); } };
$("home").onclick = () => { show("start"); renderStart(); };
$("openManage").onclick = () => { show("manage"); renderManage(); };
$("mback").onclick = () => { show("start"); renderStart(); };
$("resetKnown").onclick = () => { known.clear(); saveKnown(); renderManage(); };
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (!answered && e.key >= "1" && e.key <= String(OPTIONS)) {
    const b = $("opts").children[+e.key - 1]; if (b) answer(b.dataset.name);
  } else if (answered && e.target.tagName !== "BUTTON" && (e.key === "Enter" || (e.key === " " && e.target.tagName !== "INPUT"))) {
    e.preventDefault(); next();
  } else if (answered && (e.key === "k" || e.key === "K")) {
    $("knownBox").click();
  }
});
renderStart();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
